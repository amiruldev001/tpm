<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie & TDEE Tracker PWA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
</head>
<body>
    <div class="container">
        <header>
            <h1>Daily Calorie Tracker</h1>
            <p>Mifflin-St Jeor & TDEE Calculator</p>
        </header>

        <section class="card">
            <h2>Profil & TDEE</h2>
            <div class="grid-2">
                <div class="input-group">
                    <label for="weight">Berat (kg)</label>
                    <input type="number" id="weight" value="91.3" step="0.1">
                </div>
                <div class="input-group">
                    <label for="height">Tinggi (cm)</label>
                    <input type="number" id="height" value="144">
                </div>
                <div class="input-group">
                    <label for="age">Umur</label>
                    <input type="number" id="age" value="45">
                </div>
                <div class="input-group">
                    <label for="gender">Jantina</label>
                    <select id="gender">
                        <option value="female" selected>Perempuan (F)</option>
                        <option value="male">Lelaki (M)</option>
                    </select>
                </div>
            </div>
            <div class="input-group full-width">
                <label for="activity">Tahap Aktiviti (TDEE)</label>
                <select id="activity">
                    <option value="1.2">Sedentari (Duduk sahaja, kerja pejabat) - 1.2</option>
                    <option value="1.375" selected>Aktif Ringan (Senaman 1-3 hari/minggu) - 1.375</option>
                    <option value="1.55">Aktif Sederhana (Senaman 3-5 hari/minggu) - 1.55</option>
                    <option value="1.725">Sangat Aktif (Senaman 6-7 hari/minggu) - 1.725</option>
                    <option value="1.9">Ekstrem Aktif (Atlet / 2x latihan sehari) - 1.9</option>
                </select>
            </div>
        </section>

        <section class="stats-grid">
            <div class="stat-card">
                <h3>BMR</h3>
                <p id="bmr-val">0</p>
                <span>kcal</span>
            </div>
            <div class="stat-card">
                <h3>TDEE (Needs)</h3>
                <p id="tdee-val">0</p>
                <span>kcal</span>
            </div>
            <div class="stat-card">
                <h3>Intake</h3>
                <p id="intake-val">0</p>
                <span>kcal</span>
            </div>
            <div class="stat-card highlight">
                <h3>Cal Deficit</h3>
                <p id="deficit-val">0</p>
                <span>kcal</span>
            </div>
        </section>

        <section class="card">
            <div class="section-header">
                <h2>Senarai Makanan Harian</h2>
                <button id="add-item-btn" class="btn-primary">+ Tambah Makanan</button>
            </div>
            
            <div id="meal-container">
                </div>
        </section>
    </div>

    <div id="food-modal" class="modal">
        <div class="modal-content">
            <h3>Tambah Makanan / Minuman</h3>
            <div class="input-group">
                <label for="food-category">Waktu Makan</label>
                <select id="food-category">
                    <option value="Breakfast">Breakfast</option>
                    <option value="Snack am">Snack am</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Snack pm">Snack pm</option>
                    <option value="Dinner">Dinner</option>
                </select>
            </div>
            <div class="input-group">
                <label for="food-name">Nama Makanan</label>
                <input type="text" id="food-name" placeholder="Cth: Kerabu Sayur">
            </div>
            <div class="input-group">
                <label for="food-cal">Kalori (kcal)</label>
                <input type="number" id="food-cal" placeholder="Cth: 150">
            </div>
            <div class="modal-actions">
                <button id="close-modal" class="btn-secondary">Batal</button>
                <button id="save-food" class="btn-primary">Simpan</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
